{% extends "base.html" %}

{% block title %}Record Maintenance Task — {{ product.name }} — My Control{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">

      <!-- Back Navigation -->
      <div class="mb-3">
        <a href="{{ url_for('view_maintenance', product_id=product.id) }}" class="btn btn-ghost btn-sm">
          <i class="bi bi-arrow-left"></i> Back to Maintenance Logs
        </a>
      </div>

      <!-- Card -->
      <div class="card shadow-md border-0" style="background: var(--bg-surface); border-radius: var(--radius-xl); border: 1px solid var(--border-color) !important;">
        <div class="card-header d-flex align-items-center gap-2">
          <div class="stat-icon primary" style="width: 36px; height: 36px; font-size: 1.1rem;">
            <i class="bi bi-wrench-adjustable-circle"></i>
          </div>
          <div>
            <h5 class="mb-0 fw-bold">Record Maintenance Task</h5>
            <small class="text-muted">Asset: <strong style="color: var(--text-main);">{{ product.name }}</strong></small>
          </div>
        </div>

        <form method="POST">
          <div class="card-body p-4">

            <!-- Task Name -->
            <div class="mb-3">
              <label class="form-label">Maintenance Task <span class="text-danger">*</span></label>
              <input
                type="text"
                name="task"
                class="form-control"
                placeholder="e.g. Deep Filter Cleaning, Gas Refill, Oil Change"
                required
              >
            </div>

            <!-- Last & Next Service Dates -->
            <div class="row g-3 mb-3">
              <div class="col-sm-6">
                <label class="form-label">Last Service Date</label>
                <input type="date" name="last_done_date" class="form-control">
              </div>

              <div class="col-sm-6">
                <label class="form-label">Next Service Due Date</label>
                <input type="date" name="next_due_date" class="form-control">
              </div>
            </div>

            <!-- Provider & Cost -->
            <div class="row g-3 mb-3">
              <div class="col-sm-6">
                <label class="form-label">Service Provider / Technician</label>
                <input
                  type="text"
                  name="service_provider"
                  class="form-control"
                  placeholder="e.g. Urban Company, Authorized Tech"
                >
              </div>

              <div class="col-sm-6">
                <label class="form-label">Cost (₹)</label>
                <input
                  type="number"
                  step="0.01"
                  min="0"
                  name="cost"
                  class="form-control"
                  placeholder="0.00"
                >
              </div>
            </div>

            <!-- Notes -->
            <div class="mb-3">
              <label class="form-label">Service Notes & Invoice Details</label>
              <textarea
                name="notes"
                rows="3"
                class="form-control"
                placeholder="Replaced capacitors, serviced motor, next filter change in 6 months..."
              ></textarea>
            </div>

          </div>

          <div class="card-footer d-flex justify-content-between align-items-center p-3">
            <a href="{{ url_for('view_maintenance', product_id=product.id) }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-lg"></i> Save Maintenance Record
            </button>
          </div>
        </form>

      </div>

    </div>
  </div>
</div>
{% endblock %}
